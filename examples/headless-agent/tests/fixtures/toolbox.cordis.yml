# Keyless toolbox-overlay smoke: the full CLI base with the real DeepSeek
# adapter disabled and a mock LLM, plus the toolbox pair and the worker-thread
# code runtime. Loader launch resolution mirrors cli.cordis.yml.

- id: toolbox-mock-llm
  name: './toolbox-mock-llm.ts'

- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: toolbox-mock
              model: toolbox-mock
              cwd: !!js process.cwd()
          workspaceContext: false
          dshHome: './.dsh-home'
          skills:
            filesystem:
              agentsHome: './.agents-home'
          persona: 'Keyless toolbox smoke.'
      - id: persistence
        name: '@deepseek-ai/dsh-session-persistence-jsonl'
        config:
          root: './.sessions'
      - insert:
          - id: code-runtime
            name: '@deepseek-ai/dsh-code-runtime-worker-thread'

- id: toolbox
  name: '@deepseek-ai/dsh-toolbox'
  config:
    path: !!js "`${process.cwd()}/.dsh-toolbox/toolbox.jsonl`"

- id: tool-toolbox
  name: '@deepseek-ai/dsh-tool-toolbox'
